      # # Updates my home IP in AWS for the openvpn container
      # dyndns.aws:
      #   container_name: dyndns.aws
      #   image: dyndns.aws:latest
      #   restart: "no" # This is done via /etc/cron.d/containers
      #   env_file:
      #       - .env.dyndns.aws

  # A logging solution
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9090:8080

  portainer:
    container_name: portainer
    image: portainer/portainer-ce
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - 9000:9000

volumes:
 upload-volume:
   external: true
 ovpn-data-volume:
   external: true
 portainer_data:
   external: true
