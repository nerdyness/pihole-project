services:
  # More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
  pihole:
    container_name: pihole
    image: my-pi-hole:latest
    dns:
      - 1.1.1.1
    env_file:
      - .env.pihole
    # Needed so DHCP works! It uses
    # * udp/53
    # * tcp/53
    # * tcp/80
    # * tcp/443
    network_mode: "host"
    environment:
      # ServerIP is needed for pihole to resolve its own hostname and pi.hole
      ServerIP: 192.168.0.1
    volumes:
      - './pihole/etc-pihole/:/etc/pihole/'
      - './pihole/etc-dnsmasq.d/:/etc/dnsmasq.d/'
    # Recommended but not required (DHCP needs NET_ADMIN)
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    cap_add:
      - NET_ADMIN
    restart: unless-stopped # Launch container on reboot or crash

  # A custom container to upload data to AWS
  unify:
    container_name: unifi
    image: jacobalberty/unifi
    environment:
      SYSTEM_IP: 172.22.22.1
      TZ: 'Europe/Oslo'

    ports:
      - "3478:3478/udp" # STUN
      - "6789:6789/tcp" # Speed test
      - "8080:8080/tcp" # Device/ controller comm.
      - "8443:8443/tcp" # Controller GUI/API as seen in a web browser
      - "8880:8880/tcp" # HTTP portal redirection
      - "8843:8843/tcp" # HTTPS portal redirection
      - "10001:10001/udp" # AP discovery
    volumes:
      - './unifi:/usr/lib/unifi'
    restart: "unless-stopped" # This is done via /etc/cron.d/containers

  # A custom container to upload data to AWS
